[package]
name = "natally-ephemeris"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "host.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
cc = "1.4.5"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[workspace]
