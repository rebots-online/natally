<script>
  (function() {
    // Typewriter effect for "natally"
    const targetText = "natally";
    const typewriterElement = document.getElementById("typewriter-target");
    let charIndex = 0;

    function typeCharacter() {
      if (!typewriterElement) return;
      if (charIndex < targetText.length) {
        typewriterElement.textContent += targetText.charAt(charIndex);
        charIndex++;
        setTimeout(typeCharacter, 140 + Math.random() * 80);
      }
    }

    // Start typewriter after a soft celestial pause
    setTimeout(typeCharacter, 350);

    // Live loading bar and telemetry progression simulator
    const progressPercentEl = document.getElementById("progress-percent");
    const asciiBarEl = document.getElementById("ascii-bar");
    const fillEl = document.getElementById("smooth-progress-fill");
    const telemetryLabelEl = document.getElementById("telemetry-label");

    let currentPercent = 64;
    const stages = [
      { max: 75, text: "CALIBRATING EPHEMERIS" },
      { max: 88, text: "SYNCHRONIZING HOUSES" },
      { max: 96, text: "CALCULATING RETROGRADES" },
      { max: 100, text: "CHART READY" }
    ];

    function updateAsciiBar(pct) {
      const totalTicks = 10;
      const filledCount = Math.min(totalTicks, Math.floor((pct / 100) * totalTicks));
      const emptyCount = Math.max(0, totalTicks - filledCount);
      return "[" + "|".repeat(filledCount) + "·".repeat(emptyCount) + "]";
    }

    const interval = setInterval(function() {
      if (currentPercent < 100) {
        currentPercent += 1;
        if (progressPercentEl) progressPercentEl.textContent = currentPercent + "%";
        if (fillEl) fillEl.style.width = currentPercent + "%";
        if (asciiBarEl) asciiBarEl.textContent = updateAsciiBar(currentPercent);

        // Update telemetry label as percentage climbs
        const currentStage = stages.find(function(s) { return currentPercent <= s.max; });
        if (currentStage && telemetryLabelEl) {
          telemetryLabelEl.textContent = currentStage.text;
        }
      } else {
        clearInterval(interval);
      }
    }, 180);
  })();
