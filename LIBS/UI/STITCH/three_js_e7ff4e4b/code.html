<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js 3D Astrological Torus / Zodiac Wheel
const width = container.clientWidth || 320;
const height = container.clientHeight || 200;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 3.2, 4.2);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Ambient and warm rim lighting matching plum and brass gold palette
const ambientLight = new THREE.AmbientLight(0xd4af37, 0.8);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0xf2a38c, 2.5, 20);
pointLight1.position.set(2, 4, 3);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x9fb4ff, 2.0, 20);
pointLight2.position.set(-3, -2, 2);
scene.add(pointLight2);

// Group holding the entire celestial wheel
const wheelGroup = new THREE.Group();
scene.add(wheelGroup);

// Torus Wheel
const torusGeo = new THREE.TorusGeometry(1.6, 0.38, 32, 100);
const torusMat = new THREE.MeshStandardMaterial({
  color: 0x271c36,
  emissive: 0x1f1430,
  roughness: 0.35,
  metalness: 0.75,
  wireframe: false
});
const torusMesh = new THREE.Mesh(torusGeo, torusMat);
torusMesh.rotation.x = Math.PI / 2;
wheelGroup.add(torusMesh);

// Outer golden hairline ring
const ringGeo1 = new THREE.RingGeometry(2.05, 2.08, 64);
const ringMat1 = new THREE.MeshBasicMaterial({ color: 0xd4af37, side: THREE.DoubleSide });
const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
ring1.rotation.x = Math.PI / 2;
wheelGroup.add(ring1);

// Inner golden hairline ring
const ringGeo2 = new THREE.RingGeometry(1.15, 1.18, 64);
const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xd4af37, side: THREE.DoubleSide });
const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
ring2.rotation.x = Math.PI / 2;
wheelGroup.add(ring2);

// 12 Zodiac segment division markers along the torus ring
const markerGroup = new THREE.Group();
for (let i = 0; i < 12; i++) {
  const angle = (i / 12) * Math.PI * 2;
  const beadGeo = new THREE.SphereGeometry(0.065, 16, 16);
  const beadMat = new THREE.MeshStandardMaterial({
    color: i % 3 === 0 ? 0xd4af37 : (i % 2 === 0 ? 0xf2a38c : 0x9fb4ff),
    emissive: 0xd4af37,
    emissiveIntensity: 0.5,
    roughness: 0.2
  });
  const bead = new THREE.Mesh(beadGeo, beadMat);
  bead.position.set(Math.cos(angle) * 1.6, 0.38, Math.sin(angle) * 1.6);
  markerGroup.add(bead);

  // Radial spoke lines
  const spokeGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.9, 8);
  const spokeMat = new THREE.MeshBasicMaterial({ color: 0x322641 });
  const spoke = new THREE.Mesh(spokeGeo, spokeMat);
  spoke.position.set(Math.cos(angle) * 1.6, 0, Math.sin(angle) * 1.6);
  spoke.rotation.z = Math.PI / 2;
  spoke.rotation.y = -angle;
  markerGroup.add(spoke);
}
wheelGroup.add(markerGroup);

// Central celestial star orb
const coreGeo = new THREE.SphereGeometry(0.42, 32, 32);
const coreMat = new THREE.MeshStandardMaterial({
  color: 0xd4af37,
  emissive: 0xd4af37,
  emissiveIntensity: 0.6,
  roughness: 0.1,
  metalness: 0.9
});
const coreOrb = new THREE.Mesh(coreGeo, coreMat);
coreOrb.position.set(0, 0, 0);
wheelGroup.add(coreOrb);

// Tilt wheel slightly for an observatory desk perspective
wheelGroup.rotation.x = 0.35;
wheelGroup.rotation.z = -0.15;

function animate() {
  requestAnimationFrame(animate);
  wheelGroup.rotation.y += 0.006;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = container.clientWidth || 320;
  const h = container.clientHeight || 200;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->
</body>
</html>
