[package]
name = "license-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "natally license bridge (ARCHITECTURE §9.4): processor webhooks, Ed25519 license tokens, single-use redeem codes, signed deny-list"

[lib]
name = "license_bridge"
path = "src/lib.rs"

[[bin]]
name = "license-bridge"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
subtle = "2"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
# Prod RevenueCat REST v2 verifier (reqwest). Kept out of the default build so
# tests compile and run with zero network surface (house: no network in tests).
http-rc = ["dep:reqwest"]

[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["json", "rustls-tls"]
